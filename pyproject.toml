[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hollytranscricao"
dynamic = ["version"]
description = "Transcrição local de áudio e vídeo para Markdown, SRT e TXT."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Thiago Albuquerque"}]
keywords = ["transcription", "whisper", "audio", "video", "mlx", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6==6.11.2",
  "faster-whisper==1.2.1",
  "soundfile==0.14.0",
  "urllib3>=2.8.0,<3",
  "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
diarization = [
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "pyannote.audio==4.0.4",
  "aiohttp>=3.14.3",
  "Pillow>=12.3.0",
  "nltk>=3.10.0",
]
dev = [
  "PyInstaller==6.22.3",
  "bandit==1.9.4",
  "Pillow==12.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[project.gui-scripts]
hollytranscricao = "hollytranscricao.main:main"

[project.urls]
Homepage = "https://github.com/HollyGM/HollyTranscricao"
Issues = "https://github.com/HollyGM/HollyTranscricao/issues"

[tool.setuptools.dynamic]
version = {attr = "hollytranscricao.version.__version__"}

[tool.setuptools.packages.find]
include = ["hollytranscricao*"]

[tool.setuptools.package-data]
hollytranscricao = ["gui/styles.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"hollytranscricao/main.py" = ["E402"]
